    <script>
      const maskable = location.hash === "#maskable";
      const profile = location.hash === "#profile";
      const scale = maskable || profile ? 1.15 : 1.25;
      const nameWidth = 170; // inside the ring's 234-wide hole
      const R = 130; // ring radius
      const r = 13; // bead radius
      const cy = 231; // ring centre; the tassel hangs below it
      const NS = "http://www.w3.org/2000/svg";
      const g = document.createElementNS(NS, "g");
      g.setAttribute(
        "transform",
        `translate(256 256) scale(${scale}) translate(-256 -256)`,
      );
      const add = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        g.appendChild(el);
      };
      for (let i = 0; i < 30; i++) {
        const a = (i / 30) * 2 * Math.PI;
        add("circle", {
          cx: (256 + R * Math.sin(a)).toFixed(1),
          cy: (cy - R * Math.cos(a)).toFixed(1),
          r,
          fill: i % 10 === 0 ? "#C98A1E" : "#1F5A45",
        });
      }
      add("line", {
        x1: 256,
        y1: cy + R + r,
        x2: 256,
        y2: cy + R + 29,
        stroke: "#1F5A45",
        "stroke-width": 4,
      });
      add("circle", { cx: 256, cy: cy + R + 46, r: 17, fill: "#C98A1E" });
      document.getElementById("icon").appendChild(g);
      if (profile) {
        const name = document.getElementById("wordmark").firstElementChild;
        g.appendChild(name);
        const box = name.getBBox();
        const s = nameWidth / box.width;
        const x = 256 - s * (box.x + box.width / 2);
        const y = cy - s * (box.y + box.height / 2);
        name.setAttribute("transform", `translate(${x} ${y}) scale(${s})`);
      }
    </script>
