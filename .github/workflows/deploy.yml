name: Deploy

# Ships one ref to one environment: `convex deploy` pushes the backend, then the web app is built
# and uploaded to Vercel (see docs/deploy.md). Called by main.yml; run it by hand to redeploy or
# roll back (production accepts release tags only).
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      ref:
        description: "Release tag for production (v1.2.3); any commit, branch, or tag for staging"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://wirdak.app' || 'https://stg.wirdak.app' }}
    env:
      TARGET: ${{ inputs.environment }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Environment secret: each GitHub environment holds the key of its own Convex deployment.
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Staging is a production-type Convex deployment served from a non-production Vercel
      # environment, which `convex deploy` refuses by default. Only staging turns that check off.
      CONVEX_CHECK_BUILD_ENVIRONMENT: ${{ inputs.environment == 'staging' && 'disable' || 'enable' }}
    steps:
      - name: Production deploys release tags only
        if: inputs.environment == 'production'
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::production deploys a release tag such as v1.2.3, got '$REF'"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global vercel@56
      - run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
      # Runs the buildCommand in apps/web/vercel.json: `convex deploy` first, then the Vite build.
      - name: Build
        run: |
          if [[ "$TARGET" == production ]]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --target="$TARGET" --token="$VERCEL_TOKEN"
          fi
      - name: Deploy
        run: |
          if [[ "$TARGET" == production ]]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --target="$TARGET" --token="$VERCEL_TOKEN")
          fi
          echo "Deployed ${{ inputs.ref }} to $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
