name: CI

# Pull requests run this directly; pushes to main run it through main.yml before deploying.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Bun installs packages; Vite, Vitest, Convex and the rest still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # `bun run test` runs Vitest; `bun test` would start Bun's own test runner instead.
      - run: bun run test
      # The same build Vercel runs after `convex deploy` (see docs/deploy.md), so a broken
      # bundle fails here first. A placeholder URL: without one, main.tsx renders only the
      # "missing VITE_CONVEX_URL" notice and the app itself would be tree-shaken away.
      - run: bun run --filter web build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud
