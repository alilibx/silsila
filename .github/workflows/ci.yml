name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Pushes the Convex functions to production after every merge to main. Vercel deploys the
  # web app by itself from the same push (see docs/deploy.md).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-convex-prod
      cancel-in-progress: false
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      # Secrets cannot be read in `if:`, so the key is checked here and later steps follow its output.
      - name: Check for CONVEX_DEPLOY_KEY
        id: key
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CONVEX_DEPLOY_KEY is not set, so the Convex deploy is skipped. See docs/deploy.md."
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.present == 'true'
        run: pnpm exec convex deploy
