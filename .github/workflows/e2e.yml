name: E2E

# The Playwright suite on every browser engine and device size in playwright.config.ts, against
# the local anonymous Convex backend (no cloud project, no secrets, no real WhatsApp). Its own
# workflow, not part of ci.yml, so a slow or flaky browser never holds up a staging deploy.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # Bun installs packages; Playwright, Vite and the Convex CLI still run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # The browsers are pinned by the Playwright version, so the lockfile keys their cache.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bun run playwright install --with-deps chromium webkit firefox
      # A cached download still needs the system libraries WebKit and Firefox link against.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bun run playwright install-deps chromium webkit firefox
      - run: bun run e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
